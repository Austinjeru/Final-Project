<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Pork Paradise</title>
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <header>
    <h1>Pork Paradise</h1>
    <nav>
        <a href="home.html">Home page</a>
      <a href="#reservation">Reservations</a>
      <a href="menu.html">Menu</a>
      <a href="#order">Order online</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Welcome to Pork Paradise</h2>
    <p>Home of the juiciest pork dishes in town.</p>
  </section>

  <section id="order" class="order-section">
    <h2>Order Online</h2>
    <form id="orderForm">
      <label for="dish">Select Dish:</label>
      <select id="dish" name="dish">
        <option value="bbq">BBQ Pork Ribs</option>
        <option value="pulled">Pulled Pork Sandwich</option>
        <option value="chop">Grilled Pork Chops</option>
      </select>
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" name="quantity" min="1" value="1" />
      <button type="submit">Place Order</button>
    </form>
    <p id="orderMessage"></p>
  </section>

  <section id="reservation" class="reservation-section">
    <h2>Make a Reservation</h2>
    <form id="reservationForm">
      <label for="name">Full Name:</label>
      <input type="text" id="name" required />

      <label for="date">Date:</label>
      <input type="date" id="date" required />

      <label for="time">Time:</label>
      <input type="time" id="time" required />

      <label for="guests">Number of Guests:</label>
      <input type="number" id="guests" min="1" required />

      <button type="submit">Book Table</button>
    </form>
    <p id="reservationMessage"></p>
  </section>

  <footer>
    <p>&copy; 2025 Pork Paradise. All rights reserved.</p>
  </footer>

  <script src="index.js"></script>
</body>
</html>
